# Cloud Build configuration for BigQuery Anti-Pattern Recognition - Batch Job Deployment
# This builds the container for Cloud Run Job (batch processing)

steps:
- name: 'gcr.io/cloud-builders/mvn'
  dir: 'bigquery-antipattern-recognition'
  args:
    - 'compile'
    - 'jib:build'
    - '-DskipTests'
    - '-Dcontainer.mainClass=com.google.zetasql.toolkit.antipattern.Main'
    - '-Djib.to.image=${_CONTAINER_IMAGE_NAME}'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

substitutions:
  _CONTAINER_IMAGE_NAME: 'gcr.io/${PROJECT_ID}/bq-antipattern-batch:latest'
